name: Sync upstream fork (liwwyy -> this fork)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: fork-upstream-merge
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          fetch-depth: 0

      - name: Merge stable upstream fork into main
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/liwwyy/OneForAllLauncher.git
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with liwwyy/OneForAllLauncher."
            exit 0
          fi
          if git merge --no-edit FETCH_HEAD; then
            echo "Merged cleanly."
          else
            echo "Merge conflicts; applying fork resolution rules."
            conflicts="$(git diff --name-only --diff-filter=U)"
            printf '%s\n' "$conflicts"
            # This fork ships its own Windows-only signed release workflow; keep ours.
            if printf '%s\n' "$conflicts" | grep -Fxq '.github/workflows/oneclient_release.yml'; then
              git checkout --ours -- .github/workflows/oneclient_release.yml
              git add .github/workflows/oneclient_release.yml
            fi
            # Lang files: three-way merge that keeps fork keys and takes upstream updates.
            while IFS= read -r f; do
              case "$f" in
                packages/oneclient_app/lang/*.json)
                  node .github/scripts/merge-lang.js "$f"
                  git add "$f"
                  ;;
              esac
            done <<< "$conflicts"
            remaining="$(git diff --name-only --diff-filter=U)"
            if [ -n "$remaining" ]; then
              echo "::error::Unresolved merge conflicts:"
              printf '%s\n' "$remaining"
              exit 1
            fi
            git commit --no-edit
          fi
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Build and publish a signed release for the new version
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run oneclient_release.yml --ref main
